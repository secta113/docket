[package]
name = "docket"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
percent-encoding = "2.3.2"
regex = "1.13.1"
# Pinned exactly: an internal crate of Ruff, whose API changes between any two versions
ruff_python_ast = "=0.0.16"
ruff_python_parser = "=0.0.16"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
unicode-general-category = "1.1.0"
yaml-rust2 = "0.13.0"

[workspace]
members = ["xtask"]

[dev-dependencies]
tempfile = "3.27.0"
