# The development environment: `docker compose run --rm dev cargo xtask ci`.
# Linux, as in GitHub Actions, and the host needs only Docker (a native build on Windows needs the MSVC linker and the
# Windows SDK).
services:
  dev:
    build: .
    working_dir: /work
    volumes:
      - .:/work
      # Downloaded crates and build output stay in volumes: writing them through the bind mount is slow, and the build
      # output of Linux would mix with the host's
      - cargo-registry:/usr/local/cargo/registry
      - target:/target
      # The MSVC runtime and the Windows SDK that cargo-xwin downloads, kept between runs
      - xwin-cache:/root/.cache/cargo-xwin
    environment:
      CARGO_TARGET_DIR: /target

volumes:
  cargo-registry:
  target:
  xwin-cache:
