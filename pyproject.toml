# The Python package: a wheel that carries only the docket binary (no Python code), installed with pip like ruff
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "docket"
description = "Checks the records an agent works from (backlog, specs, log) and writes their index files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
# The notices of the crates the binary links go with it, in the wheel's .dist-info/licenses/
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES.txt"]
# Taken from Cargo.toml
dynamic = ["version"]

[tool.maturin]
bindings = "bin"
