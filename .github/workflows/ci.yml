name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # The same base image as the Dockerfile. The components come from rust-toolchain.toml, as in the Dockerfile
    container: rust:1.98.1
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      # The same entry point as on a developer machine
      - run: cargo xtask ci

  # The wheels pip installs. Windows builds and tests natively, so the binary is tested on the platform it runs on
  wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo test --workspace --no-fail-fast
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-build.txt
      - run: maturin build --release --out dist
      # The wheel installs, and its binary runs, as it will for a user
      - run: pip install --find-links dist docket
      - run: docket --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
